<!-- ================= HEADER ================= -->
<section class="section text-center">
  <div class="container reveal-fallback">
    <h1 class="fw-bold">Add Product Contribution</h1>
    <p>Help improve our database 🌿</p>
  </div>
</section>

<!-- ================= FORM ================= -->
<section class="section bg-cream">
<div class="container">

<form id="contributionForm" class="custom-box p-4 shadow-sm">

  <!-- BASIC INFO -->
  <h4 class="mb-3">Basic Information</h4>
  <div class="row">
    <div class="col-md-6 mb-3">
      <input type="text" class="form-control" id="productName" placeholder="Product Name" required>
    </div>
    <div class="col-md-6 mb-3">
      <input type="text" class="form-control" id="brandName" placeholder="Brand Name" required>
    </div>
  </div>

  <!-- INGREDIENTS -->
  <h4 class="mb-3 mt-4">Ingredients</h4>
  <textarea class="form-control mb-3" id="ingredients" rows="4"
    placeholder="Enter ingredients separated by commas"></textarea>

  <!-- IMAGE -->
  <h4 class="mb-3 mt-4">Upload Image</h4>
  <input type="file" class="form-control mb-4">

  <!-- SUBMIT -->
  <div class="text-center">
    <button type="submit" class="btn btn-success px-5 py-2">
      Submit
    </button>
  </div>

</form>

</div>
