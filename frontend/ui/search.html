    <section class="barcode-section">
    <div class="scanner-card">
        <h2 class="scanner-title">Product Search</h2>
        <p class="scanner-subtitle">Scan a barcode or upload an image to search.</p>

        <div class="scanner-actions">
            <button class="action-btn scan-btn" id="start-camera-btn">
                <i class="fas fa-camera"></i>
                <span>Scan Barcode</span>
            </button>

            <div class="divider">OR</div>

            <label for="barcode-upload" class="action-btn upload-btn">
                <i class="fas fa-upload"></i>
                <span>Upload Image</span>
            </label>
            <input type="file" id="barcode-upload" accept="image/*" class="hidden-input">
        </div>
        
        <div class="search-bar-container">
            <input type="text" id="barcode-result" class="barcode-input" placeholder="Barcode number will appear here...">
            <button class="search-submit-btn" title="Search">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>
</section>
